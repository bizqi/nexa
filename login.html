<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — IKI</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="card">

  <!-- LOGO -->
  <div class="logo-wrap">
    <div class="logo-mark">IKI</div>
    <div class="logo-text">
      <h1>IKI Platform</h1>
      <span>Sistem Informasi</span>
    </div>
  </div>

  <!-- ALERT -->
  <div class="alert" id="alert"></div>

  <!-- LOGIN FORM -->
  <div id="loginSection">
    <div class="card-title">Selamat datang</div>
    <div class="card-sub">Masuk untuk melanjutkan ke platform IKI</div>

    <!-- GOOGLE LOGIN -->
    <button class="social-btn" id="googleBtn" onclick="loginGoogle()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Lanjutkan dengan Google
    </button>

    <div class="divider">atau masuk dengan email</div>

    <form id="emailForm" onsubmit="loginEmail(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email@kamu.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Masukkan password" required>
          <button type="button" class="pw-toggle" onclick="togglePw()">
            <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-options">
        <label class="remember">
          <input type="checkbox" id="remember"> Ingat saya
        </label>
        <a href="#" class="forgot" onclick="openForgot(event)">Lupa password?</a>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Masuk</button>
    </form>

    <div class="card-footer">
      Belum punya akun? <a href="#">Daftar di sini</a>
    </div>
  </div>

  <!-- USER CARD (setelah login) -->
  <div class="user-card" id="userCard">
    <div id="avatarWrap"></div>
    <div class="user-name" id="userName"></div>
    <div class="user-email" id="userEmail"></div>
    <a href="iki.html" class="to-app-btn">Masuk ke Platform IKI →</a>
    <button class="logout-btn" onclick="logout()">Keluar dari akun ini</button>
  </div>

</div>

<!-- MODAL LUPA PASSWORD -->
<div class="modal-bg" id="forgotModal">
  <div class="modal">
    <h3>Reset Password</h3>
    <p>Masukkan email kamu, kami akan kirim link reset password.</p>
    <label>Email</label>
    <input type="email" id="forgotEmail" placeholder="email@kamu.com" style="margin-top:6px">
    <div id="forgotAlert" class="alert" style="margin-top:12px;margin-bottom:0"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeForgot()">Batal</button>
      <button class="btn-send" onclick="sendReset()">Kirim Link</button>
    </div>
  </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    signOut,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  /* ====================================================
     🔧 KONFIGURASI FIREBASE — GANTI DENGAN PUNYA KAMU
     Buka: https://console.firebase.google.com
     Project Settings → Your apps → SDK setup → Config
     ==================================================== */
  const firebaseConfig = {
  apiKey: "AIzaSyBq30K69ezDu86TewFcMtQVR7WhCes92oA",
  authDomain: "iki-d35c9.firebaseapp.com",
  projectId: "iki-d35c9",
  storageBucket: "iki-d35c9.firebasestorage.app",
  messagingSenderId: "745498733905",
  appId: "1:745498733905:web:5571e71887e21f919d3770",
  measurementId: "G-VXMXSQ2ZZW"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const gProvider = new GoogleAuthProvider();

  /* ---- HELPER UI ---- */
  function showAlert(msg, type = 'error', target = 'alert') {
    const el = document.getElementById(target);
    el.className = `alert ${type} show`;
    el.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
    if (type !== 'loading') {
      el.innerHTML = `<span>${type === 'error' ? '✕' : '✓'}</span><span>${msg}</span>`;
    }
  }

  function hideAlert(target = 'alert') {
    document.getElementById(target).className = 'alert';
  }

  function setBtnLoading(id, loading) {
    const btn = document.getElementById(id);
    if (loading) {
      btn.dataset.original = btn.innerHTML;
      btn.innerHTML = '<div class="spinner" style="display:inline-block;margin:0 auto"></div>';
      btn.disabled = true;
    } else {
      btn.innerHTML = btn.dataset.original || btn.innerHTML;
      btn.disabled = false;
    }
  }

  function showUserCard(user) {
    // Langsung redirect ke halaman utama setelah login
    // Ganti 'iki.html' dengan nama file utama kamu
    window.location.href = 'iki.html';
  }

  /* ---- AUTH STATE ---- */
  onAuthStateChanged(auth, user => {
    if (user) showUserCard(user);
  });

  /* ---- GOOGLE LOGIN ---- */
  window.loginGoogle = async function() {
    try {
      setBtnLoading('googleBtn', true);
      hideAlert();
      const result = await signInWithPopup(auth, gProvider);
      showUserCard(result.user);
    } catch (err) {
      const msgs = {
        'auth/popup-closed-by-user': 'Login dibatalkan.',
        'auth/network-request-failed': 'Tidak ada koneksi internet.',
        'auth/popup-blocked': 'Popup diblokir browser. Izinkan popup lalu coba lagi.',
      };
      showAlert(msgs[err.code] || 'Gagal login dengan Google. Coba lagi.');
      setBtnLoading('googleBtn', false);
    }
  };

  /* ---- EMAIL LOGIN ---- */
  window.loginEmail = async function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    try {
      setBtnLoading('loginBtn', true);
      hideAlert();
      await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
      const result = await signInWithEmailAndPassword(auth, email, password);
      showUserCard(result.user);
    } catch (err) {
      const msgs = {
        'auth/user-not-found':       'Email tidak terdaftar.',
        'auth/wrong-password':       'Password salah.',
        'auth/invalid-email':        'Format email tidak valid.',
        'auth/too-many-requests':    'Terlalu banyak percobaan. Coba lagi nanti.',
        'auth/invalid-credential':   'Email atau password salah.',
        'auth/network-request-failed': 'Tidak ada koneksi internet.',
      };
      showAlert(msgs[err.code] || 'Login gagal: ' + err.message);
      setBtnLoading('loginBtn', false);
    }
  };

  /* ---- LOGOUT ---- */
  window.logout = async function() {
    await signOut(auth);
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('userCard').classList.remove('show');
  };

  /* ---- TOGGLE PASSWORD ---- */
  window.togglePw = function() {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      inp.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  };

  /* ---- FORGOT PASSWORD ---- */
  window.openForgot = function(e) {
    e.preventDefault();
    document.getElementById('forgotEmail').value = document.getElementById('email').value;
    document.getElementById('forgotModal').classList.add('show');
    document.getElementById('forgotAlert').className = 'alert';
  };

  window.closeForgot = function() {
    document.getElementById('forgotModal').classList.remove('show');
  };

  window.sendReset = async function() {
    const email = document.getElementById('forgotEmail').value.trim();
    if (!email) { showAlert('Masukkan email kamu.', 'error', 'forgotAlert'); return; }
    try {
      showAlert('Mengirim...', 'loading', 'forgotAlert');
      await sendPasswordResetEmail(auth, email);
      showAlert('Link reset berhasil dikirim! Cek inbox kamu.', 'success', 'forgotAlert');
      setTimeout(closeForgot, 2500);
    } catch (err) {
      const msgs = {
        'auth/user-not-found': 'Email tidak terdaftar.',
        'auth/invalid-email':  'Format email tidak valid.',
      };
      showAlert(msgs[err.code] || 'Gagal mengirim email.', 'error', 'forgotAlert');
    }
  };

  /* tutup modal klik luar */
  document.getElementById('forgotModal').addEventListener('click', function(e) {
    if (e.target === this) closeForgot();
  });
</script>
</body>
</html>
